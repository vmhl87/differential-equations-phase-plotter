<!DOCTYPE html>
<html>
    <head>
        <title>Phase Plot Explorer</title>
        <script src="p5.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/14.8.1/math.js" integrity="sha512-AJmFmOXFAAzxbzp498VFGf+/Ke7n/O/Pz7L7R2in/4lEDkqhFvuIemyJo/MzXORunJkrJngeIyaWqLAj2rTY2Q==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
        <link rel="stylesheet" href="style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    </head>
    <body>
        <p>
            Variable 1: <input id="var1" style="width: 10px;" value="R"></input>, 
            Expression: <input id="exp1" value="3*R - 1.4*R*F"></input>
            <br>
            Variable 2: <input id="var2" style="width: 10px;" value="F"></input>,
            Expression: <input id="exp2" value="-F + 0.8*R*F"></input>
            <br><br>
            Initial condition:
            <input id="startx" style="width: 40px" value="1"></input>,
            <input id="starty" style="width: 40px" value="1"></input>
            <br>
            Steps: <input id="steps" style="width: 40px" value="1000">,
            Step size: <input id="stepsize" style="width: 42px" value="0.01">
        </p>
        <p id="error" style="color: red;"></p>
        <script src="app.js"></script>
    </body>
</html>
