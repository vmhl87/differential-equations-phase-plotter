<!DOCTYPE html>
<html>
    <head>
        <title>Phase Plot Explorer</title>
        <script src="p5.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/14.8.1/math.js" integrity="sha512-AJmFmOXFAAzxbzp498VFGf+/Ke7n/O/Pz7L7R2in/4lEDkqhFvuIemyJo/MzXORunJkrJngeIyaWqLAj2rTY2Q==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
        <link rel="stylesheet" href="style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    </head>
    <body>
        <div style="width: 800px">
            <div style="float: right; width: 30%; text-align: right;">
                <div id="condition-container">
                    <div>
                        Initial condition:
                        <input id="startx-0" style="width: 40px;" value="1"></input>,
                        <input id="starty-0" style="width: 40px;" value="1"></input>
                    </div>
                    <button id="new-condition" style="margin-top: 5px;">Add initial condition</button>
                    <button id="remove-condition" style="margin-top: 5px;">Remove</button>
                </div>
                <br>
                View:
                <button id="xy">X vs Y</button>
                <button id="zx">T vs X</button>
                <button id="zy">T vs Y</button>
                <p></p>
            </div>
            <div style="float: left; width: 70%;">
                Variable 1: <input id="var1" style="width: 10px;" value="R"></input>, 
                Expression: <input id="exp1" value="3*R - 1.4*R*F"></input>
                <br>
                Variable 2: <input id="var2" style="width: 10px;" value="F"></input>,
                Expression: <input id="exp2" value="-F + 0.8*R*F"></input>
                <br><br>
                Steps: <input id="steps" style="width: 40px" value="1000">,
                Step size: <input id="stepsize" style="width: 42px" value="0.01">
                <span style="display: inline-block; width: 10px;"></span>
                <button id="export">Export as CSV</button>
                <p></p>
            </div>
        </div>
        <p id="error" style="color: red;"></p>
        <script src="app.js"></script>
    </body>
</html>
